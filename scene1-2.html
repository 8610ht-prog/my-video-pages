<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>実験1シーン2</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body {
      font-family: system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      margin:20px; line-height:1.6; text-align:center;
    }
    .container {max-width:600px; margin:auto;}
    button {
      padding:10px 16px; font-size:1.1rem; border-radius:8px;
      background:#2196F3; color:#fff; border:none; cursor:pointer;
    }
    button:hover {background:#1976D2;}
    .note {margin-top:20px; color:#d32f2f; font-weight:600;}
    video {margin-top:20px; max-width:100%; border:1px solid #ccc; border-radius:8px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>実験1シーン2</h1>

    <!-- 再生ボタン -->
    <button id="playBtn">動画を再生する</button>

    <!-- 注意書き（再生前に表示） -->
    <p id="noteBefore" class="note">
      ※動画を再生する前に、Googleフォームに戻り、<br>
      事前課題直後のリラックス度の値をスライダーを用いて入力してください！
      また、事前課題直後の気分についても選択をして下さい！
    </p>

    <!-- 注意書き（再生開始後に表示、初期は非表示） -->
    <p id="noteAfter" class="note" style="display:none;">
      動画視聴は、１回限りとしてください。<br>
      動画の視聴が終わったら、Googleフォームに戻り、<br>
      動画視聴直後のリラックス度をスライダーを用いて入力してください！
      また、動画視聴直後の気分についても選択をして下さい！
    </p>

    <!-- 最初は非表示の動画 -->
    <video id="sceneVideo" controls style="display:none;">
      <source src="1-2.mp4" type="video/mp4">
      お使いのブラウザは動画再生に対応していません。
    </video>
  </div>

  <script>
    const playBtn = document.getElementById("playBtn");
    const sceneVideo = document.getElementById("sceneVideo");
    const noteBefore = document.getElementById("noteBefore");
    const noteAfter = document.getElementById("noteAfter");

    playBtn.addEventListener("click", () => {
      // 動画を表示して再生
      sceneVideo.style.display = "block";
      sceneVideo.play();
      playBtn.style.display = "none"; // ボタンは消す

      // 注意書きを切り替え
      noteBefore.style.display = "none";
      noteAfter.style.display = "block";
    });
  </script>
</body>
</html>
