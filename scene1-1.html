<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>実験1シーン1</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
         margin:20px; line-height:1.6; text-align:center;}
    .container{max-width:600px; margin:auto;}
    button{
      padding:10px 16px; font-size:1.1rem; border-radius:8px;
      background:#2196F3; color:#fff; border:none; cursor:pointer;
    }
    button:hover{background:#1976D2;}
    .note{margin-top:20px; color:#d32f2f; font-weight:600;}
    video{margin-top:20px; max-width:100%; border:1px solid #ccc; border-radius:8px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>実験1シーン1</h1>

    <!-- 再生ボタン -->
    <button id="playBtn">動画を再生する</button>

    <!-- 注意書き -->
    <p class="note">
      ※動画を再生する前に、Googleフォームに戻り、<br>
      事前課題直後のリラックス度の値をスライダーを用いて入力してください！
    </p>

    <!-- 最初は非表示の動画 -->
    <video id="sceneVideo" controls style="display:none;">
      <source src="1-1.mp4" type="video/mp4">
      お使いのブラウザは動画再生に対応していません。
    </video>
  </div>

  <script>
    document.getElementById("playBtn").addEventListener("click", () => {
      document.getElementById("sceneVideo").style.display = "block";
      document.getElementById("sceneVideo").play();
      document.getElementById("playBtn").style.display = "none"; // ボタンは消す
    });
  </script>
</body>
</html>
