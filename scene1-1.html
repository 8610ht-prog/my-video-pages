<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>実験1 シーン1 動画視聴ページ</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body {
      font-family: system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f9f9f9;
    }
    h1 {
      margin: 20px 0 10px;
      text-align: center;
    }
    .video-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 80%;
    }
    video {
      max-width: 90%;
      max-height: 90%;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #000;
    }
    .notice {
      margin-top: 15px;
      max-width: 800px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff8e1;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>実験1 シーン1 動画視聴</h1>

  <div class="video-container">
    <video id="videoPlayer" controls>
      <source src="video1-1.mp4" type="video/mp4">
      お使いのブラウザは video タグをサポートしていません。
    </video>
  </div>

  <div class="notice">
    ⚠ 動画を再生する前に、Googleフォームに戻り、事前課題直後のリラックス度の値をスライダーで入力してください。
  </div>
</body>
</html>
